<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agentic Hub</title>
    <script>
      document.documentElement.classList.toggle(
        "dark",
        window.matchMedia("(prefers-color-scheme: dark)").matches,
      );
    </script>
    <style>
      /* Match the synchronous system preference before the bundled CSS loads.
         Rust applies an explicit saved preference before opaque windows show. */
      html,
      body {
        background: #ffffff;
      }
      html.dark,
      html.dark body {
        background: #0e0f13;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
