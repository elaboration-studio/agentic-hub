name: Release (macOS)

# Builds the macOS universal bundle and publishes it as a draft GitHub Release.
# Triggered by pushing a version tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Run JS-based actions on Node 24. checkout/setup-node are already on v5 (native
# node24); this forces the remaining pinned actions (pnpm/softprops/rust-cache)
# onto node24 ahead of GitHub's June 2026 cutover. Harmless once node24 is default.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Build & release (macOS universal)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust (stable, both Apple arches)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Run from the repo root so Tauri auto-discovers crates/agentic-hub/tauri.conf.json
      # and the root-relative beforeBuildCommand (`pnpm build` -> ../../dist) resolves.
      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build macOS universal bundle
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: pnpm tauri build --target universal-apple-darwin

      - name: Publish GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          name: Agentic Hub ${{ github.ref_name }}
          body_path: RELEASE.md
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
