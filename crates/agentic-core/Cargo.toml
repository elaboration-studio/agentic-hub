[package]
name = "agentic-core"
version = "0.12.0"
description = "Pure domain crate for Agentic Hub: scan/plan/apply/sync over the shared agentic root. No Tauri dependency."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Enable `ts-rs` derives + export tests. Off by default so production builds
# never pull `ts-rs`. Run: `cargo test -p agentic-core --features ts-export`.
ts-export = ["dep:ts-rs"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
include_dir = "0.7"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
# Keyless GET against the public skills.sh search index (the same endpoint the
# `skills` CLI uses). Blocking client: the provider methods are sync. `rustls`
# avoids a system OpenSSL build dependency for the Linux bundles.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
ts-rs = { version = "10", optional = true }
toml = "1.0.7"

[dev-dependencies]
tempfile = "3"
