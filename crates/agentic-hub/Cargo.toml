[package]
name = "agentic-hub"
version = "0.8.2"
description = "Tauri 2.x desktop shell for Agentic Hub. Thin #[tauri::command] wrappers over agentic-core."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "agentic_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Mirror the core's TS codegen gate. Off by default so prod builds never pull
# `ts-rs`. Run: `cargo test -p agentic-hub --features ts-export`.
ts-export = ["dep:ts-rs", "agentic-core/ts-export"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agentic-core = { path = "../agentic-core" }
notify = "8"
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-aptabase = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
# Aptabase's plugin setup spawns its background flush loop with a bare
# `tokio::spawn`, so an active Tokio runtime must be entered before the app is
# built (Tauri does not enter one on the main thread). We own that runtime in
# `run()`.
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
# macOS-only: subclass the palette window to a non-activating NSPanel so it can
# float over other apps' full-screen Spaces (standard NSWindow cannot — see
# tauri#11488). Encapsulates the objc FFI, keeping this crate `unsafe`-free.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
ts-rs = { version = "10", optional = true }
